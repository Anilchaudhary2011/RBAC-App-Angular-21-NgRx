<div class="auth-page">
  <div class="auth-card">
    <h1>Sign in</h1>
    <p class="subtitle">Use your credentials to access the RBAC portal.</p>

    @if (error$ | async; as error) {
      <p class="alert alert-error" role="alert">{{ error }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="field-error">Enter a valid email.</span>
        }
      </label>

      <label>
        Password
        <input type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="field-error">Password must be at least 6 characters.</span>
        }
      </label>

      <button type="submit" class="btn btn-primary" [disabled]="loading$ | async">
        {{ (loading$ | async) ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="footer-link">
      No account?
      <a routerLink="/register">Register as Viewer</a>
    </p>

    <div class="demo-hint">
      <p><strong>Demo admin:</strong> admin@example.com / Anil@123</p>
    </div>
  </div>
</div>
