<div class="auth-page">
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="subtitle">Self-registration assigns the <strong>Viewer</strong> role.</p>

    @if (error$ | async; as error) {
      <p class="alert alert-error" role="alert">{{ error }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Display name
        <input type="text" formControlName="displayName" autocomplete="name" />
      </label>

      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label>
        Password
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>

      <label>
        Confirm password
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
        @if (form.controls.confirmPassword.hasError('mismatch')) {
          <span class="field-error">Passwords do not match.</span>
        }
      </label>

      <button type="submit" class="btn btn-primary" [disabled]="loading$ | async">
        {{ (loading$ | async) ? 'Creating account…' : 'Register' }}
      </button>
    </form>

    <p class="footer-link">
      Already registered?
      <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
